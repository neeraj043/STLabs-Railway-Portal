services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: railway
      MYSQL_USER: railway
      MYSQL_PASSWORD: railway
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - railway-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  railway-mysql:
